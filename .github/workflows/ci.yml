name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# packages: read — the SDK is installed from GitHub Packages, and GITHUB_TOKEN cannot read it
# without this scope. Explicit rather than inherited, because the default is read-only on
# contents and nothing else, which surfaces as a confusing 401 from npm.
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the extension drives a REMOTE browser
      # over CDP, so downloading Chromium in CI would be pure cost.
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          # The SDK comes from GitHub Packages, which authenticates even for a read. The token
          # is supplied here rather than committed to .npmrc: an earlier attempt committed one
          # and GitHub's secret scanning revoked it, breaking every later install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  # The extension against a REAL broker and a REAL browser.
  #
  # The agent is NOT part of this: a tool call is a request on
  # `easybus.<tenant>.tool.call.<extId>.<tool>`, so the test plays the agent's part with the SDK's
  # own client. That keeps the test about THIS extension — the agent's behaviour is its own suite.
  #
  # Runs after `test`, not in the Node matrix: the services do not depend on the Node version, and
  # starting a browser three times to prove that would be waste.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--wait` waits for every healthcheck, which is what makes the next step meaningful: the
      # browser node answers "ready":true only once it can accept a session, so a fast start cannot
      # be mistaken for a working one.
      #
      # Started detached and then probed, NOT `up --wait`: when a healthcheck fails, `--wait`
      # reports only "container is unhealthy" and the reason is buried in docker's pull output.
      # Starting detached lets the next step say WHY, and it prints the healthcheck's own output.
      - name: start nats + chrome
        run: docker compose -f .github/ci/compose.yaml up -d

      - name: wait for services
        run: |
          set -uo pipefail
          fail=0
          for name in ci-nats ci-chrome; do
            echo "--- waiting for $name ---"
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then echo "$name healthy after ${i}0s"; break; fi
              if [ "$status" = "unhealthy" ]; then
                echo "::error::$name is UNHEALTHY"
                docker inspect -f '{{json .State.Health}}' "$name" || true
                docker logs "$name" 2>&1 | tail -40 || true
                fail=1
                break
              fi
              sleep 2
            done
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)" != "healthy" ]; then
              echo "::error::$name never became healthy"
              docker inspect -f '{{json .State.Health}}' "$name" || true
              docker logs "$name" 2>&1 | tail -40 || true
              fail=1
            fi
          done
          exit $fail

      - name: e2e (real browser)
        env:
          E2E_NATS_URL: nats://127.0.0.1:4222
          # The extension runs on the RUNNER (the test launches it in-process), so it reaches both
          # services on their host ports. That is why compose PUBLISHES them rather than exposing.
          E2E_SELENIUM_URL: http://127.0.0.1:4444
        run: npx vitest run tests/e2e-live.test.ts

      - name: dump service logs on failure
        if: failure()
        run: docker compose -f .github/ci/compose.yaml logs --no-color

      - name: down
        if: always()
        run: docker compose -f .github/ci/compose.yaml down -v
