name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents only. The easybus SDK used to come from GitHub Packages, which needed
# `packages: read`; the protocol moved to Go and its module comes from the public proxy, so nothing
# here reads a private package any more.
permissions:
  contents: read

jobs:
  # THE GO HALF IS A SEPARATE JOB, and it must stay separate: a broken shell and a broken sidecar
  # should fail with different job names, or the reader has to open the log to find out which half of
  # a two-process image is wrong.
  goshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # GOFMT, BEFORE THE BUILD. A formatting problem is not a build failure, so it needs its own
      # step: otherwise the compiler accepts the file and the only signal is a diff nobody looks at.
      #
      # `-l` NAMES THE FILES AND EXITS 0, so the test is on its OUTPUT. Running `gofmt -l` alone would
      # pass forever; that mistake is common enough to be worth this comment.
      - name: gofmt
        run: |
          set -euo pipefail
          out="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$out" ]; then
            echo "::error::these files are not gofmt-formatted. Run: gofmt -w \$(echo \"$out\")"
            echo "$out"
            exit 1
          fi
          echo "gofmt: clean"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the extension drives a REMOTE browser
      # over CDP, so downloading Chromium in CI would be pure cost.
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  # The extension against a REAL broker and a REAL browser.
  #
  # The agent is NOT part of this: a tool call is a request on
  # `easybus.<tenant>.tool.call.<extId>.<tool>`, so the test plays the agent's part with the SDK's
  # own client. That keeps the test about THIS extension — the agent's behaviour is its own suite.
  #
  # Runs after `test`, not in the Node matrix: the services do not depend on the Node version, and
  # starting a browser three times to prove that would be waste.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # `--wait` waits for every healthcheck, which is what makes the next step meaningful: the
      # browser node answers "ready":true only once it can accept a session, so a fast start cannot
      # be mistaken for a working one.
      #
      # Started detached and then probed, NOT `up --wait`: when a healthcheck fails, `--wait`
      # reports only "container is unhealthy" and the reason is buried in docker's pull output.
      # Starting detached lets the next step say WHY, and it prints the healthcheck's own output.
      - name: start nats + chrome
        run: docker compose -f .github/ci/compose.yaml up -d

      - name: wait for services
        run: |
          set -uo pipefail
          fail=0
          for name in ci-nats ci-chrome; do
            echo "--- waiting for $name ---"
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then echo "$name healthy after ${i}0s"; break; fi
              if [ "$status" = "unhealthy" ]; then
                echo "::error::$name is UNHEALTHY"
                docker inspect -f '{{json .State.Health}}' "$name" || true
                docker logs "$name" 2>&1 | tail -40 || true
                fail=1
                break
              fi
              sleep 2
            done
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)" != "healthy" ]; then
              echo "::error::$name never became healthy"
              docker inspect -f '{{json .State.Health}}' "$name" || true
              docker logs "$name" 2>&1 | tail -40 || true
              fail=1
            fi
          done
          exit $fail

      # THE LIVE SUITE NOW DRIVES ONLY THE SIDECAR. The old one started the extension with a NATS
      # connection in-process, which is the half that moved to Go — so it was testing a protocol layer
      # this repository no longer has. What remains worth proving here is that a REAL browser under the
      # sidecar answers through /exec, which is the contract the Go shell depends on.
      #
      # The Go side's own integration (bus, manifest, permissions) belongs in its tests, not here.
      - name: e2e (real browser, sidecar only)
        env:
          E2E_SELENIUM_URL: http://127.0.0.1:4444
        run: npx vitest run tests/sidecar-live.test.ts

      - name: dump service logs on failure
        if: failure()
        run: docker compose -f .github/ci/compose.yaml logs --no-color

      - name: down
        if: always()
        run: docker compose -f .github/ci/compose.yaml down -v
