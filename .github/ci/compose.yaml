# Services for the playwright-ext end-to-end test.
#
# The extension talks only the easybus protocol over NATS; the AGENT IS NOT PART OF THIS. A tool
# call is an `easybus.<tenant>.tool.call.<extId>.<tool>` request, so the test plays the agent's
# part with the SDK's own client — which is the whole reason the test can exist without an agent.
#
# What is here is what the extension genuinely cannot fake:
#   nats    — transport, KV (config), and the object store for screenshot/PDF bytes
#   chrome  — a real browser; the extension drives it over CDP via Selenium
#
# NOT here, deliberately: S3/garage. Screenshots go through the TRANSIENT object bucket, which is
# NATS by design (in-flight hand-off, 24h TTL). Persistent bytes require S3, but nothing in this
# test writes one — and adding a bucket would test the SDK's S3 adapter, not this extension.
services:
  nats:
    image: nats:2.10-alpine
    container_name: ci-nats
    ports:
      - "4222:4222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      # Wait for the broker to ANSWER, not merely to have started: a container that is "running"
      # but not yet listening turns a startup race into a flaky test.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  chrome:
    # standalone-chrome includes a Selenium server, which is what the extension expects when it is
    # given a base URL rather than a raw CDP endpoint.
    image: selenium/standalone-chrome:4.27
    container_name: ci-chrome
    # PUBLISHED, not merely exposed: the extension runs on the RUNNER (it is launched by the test
    # process), not inside the compose network, so it reaches the browser on the host port. Using
    # `expose` would work only if the extension were a compose service.
    ports:
      - "4444:4444"
    shm_size: 2gb
    environment:
      SE_START_XVFB: "true"
      SE_NODE_MAX_SESSIONS: "4"
      # The extension sends no auth; leaving this off avoids a wrapper that rejects unauthenticated
      # WebDriver requests.
      SE_NODE_GRID_URL: ""
    healthcheck:
      # /wd/hub/status answers ""ready":true" once the node can accept a session. Checking the
      # PORT instead would pass while the browser is still starting, and the first
      # browser-create-context would fail with a timeout that names nothing.
      #
      # python3, because the two obvious alternatives both fail here and both fail LOUDLY WRONG:
      #   * curl — not guaranteed in this image, and a missing command reads as "unhealthy";
      #   * bash /dev/tcp — this container's shell gave "3: Bad file descriptor", so the check
      #     reported unhealthy while Selenium was demonstrably up and accepting sessions.
      # python3 is in the image (Selenium's own tooling needs it), and it asks the SAME question
      # the extension will: is /wd/hub/status ready.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:4444/wd/hub/status', timeout=4)); sys.exit(0 if d.get('value',{}).get('ready') else 1)"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
